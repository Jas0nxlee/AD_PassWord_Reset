name: Build and Release Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        timeout-minutes: 10
        run: npm ci --no-audit --prefer-offline

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Audit frontend dependencies
        working-directory: frontend
        timeout-minutes: 5
        run: bash ../scripts/npm-audit-ci.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Verify backend
        run: |
          pip install -r requirements-dev.txt
          pytest -q
          pip-audit -r requirements.txt

  build-windows:
    needs: quality
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install frontend dependencies
        working-directory: frontend
        timeout-minutes: 10
        run: npm ci --no-audit --prefer-offline

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build Windows package
        run: pyinstaller --clean build/reset-password-app.spec

      - name: Archive Windows package
        shell: pwsh
        run: Compress-Archive -Path dist/AD_Password_Reset/* -DestinationPath dist/AD_Password_Reset-windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AD_Password_Reset-windows
          path: dist/AD_Password_Reset-windows.zip

  build-macos:
    needs: quality
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install frontend dependencies
        working-directory: frontend
        timeout-minutes: 10
        run: npm ci --no-audit --prefer-offline

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build macOS package
        run: pyinstaller --clean build/reset-password-app.spec

      - name: Archive macOS app bundle
        run: cd dist && zip -r AD_Password_Reset-macos.zip AD_Password_Reset.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: AD_Password_Reset-macos
          path: dist/AD_Password_Reset-macos.zip

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: AD_Password_Reset-windows
          path: release-assets

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: AD_Password_Reset-macos
          path: release-assets

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            release-assets/AD_Password_Reset-windows.zip
            release-assets/AD_Password_Reset-macos.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
